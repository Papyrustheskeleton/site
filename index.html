<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Under Construction</title>
<style>
    .icons{
        display: flex;
        gap: 10px;
    }
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #008080;
    font-family: "Courier New", monospace;
    color: #fff;
  }
  .window {
    background: #c0c0c0;
    border: 2px solid #fff;
    box-shadow: 4px 4px 0 #000;
    width: 90%;
    max-width: 400px;
    color: #000;
  }
  .titlebar {
    background: linear-gradient(90deg, #000080, #1084d0);
    color: #fff;
    padding: 4px 8px;
    font-weight: bold;
    display: flex;
    justify-content: space-between;
  }
  .content {
    padding: 20px;
    text-align: center;
  }
  h1 { font-size: 18px; margin: 0 0 10px; }
  p { font-size: 14px; }
  .x {
  background: none;
  border: none;
  color: #fff;
  font-family: inherit;
  font-weight: bold;
  font-size: inherit;
  cursor: pointer;
  padding: 0;
}
.undertext {
    display: none;
    font-family: 'Times New Roman', Times, serif;
    color:#000;
}
.password_field{
    background: #373636;
    border: 1px solid #000;
}
.sub_button{
    background: #373636;
    border: 1px solid #000;
    color: #000;
}
</style>
</head>
    <body id="background-color">
        <div class="undertext" id="text">
            stop looking for things that don't exist<br>
            <input type = "password" name="password_field" class="password_field" id="field">
            <button id="submit" type="submit" class="sub_button" disabled=true onclick="clearfield()">
                submit
            </button>
        </div>

        <div class="page-content" id="menu">
            <div class="window">
                <div class="titlebar">
                <span>bluescreenofme.cc</span>
                <div class="icons">
                    <span>_</span>
                    <span>□</span>
                    <button id="x" class="x" onclick="X()">x</button>
                </div>
                </div>
                <div class="content">
                <h1>Site under construction</h1>
                <p>This page is live. Real content coming soon.</p>
                </div>
            </div>
        </div>
        <script>
        var stage = 0;
        function submit(){
            var field = document.getElementById("field");
            var sub_button = document.getElementById("submit");
            field.addEventListener("input",function(){
                console.log(field.value);
                if (field.value === "feelingblue"){
                    sub_button.style.backgroundColor = "#FFFFFF";
                    sub_button.disabled = false;
                }
                else{
                    sub_button.style.backgroundColor = "#373636";
                    sub_button.disabled = true;
                }
            })
        }
        function X(){
            var menu = document.getElementById("menu");
            var text = document.getElementById("text");
            var body = document.getElementById("background-color");
            menu.style.display = "none";
            text.style.display = "block";
            body.style.background = "#696764";
            submit()
        }
        function clearfield(){
            var field = document.getElementById("field");
            field.value = "";
        }
    </script>
    </body>
    </html>
